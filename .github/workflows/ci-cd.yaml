name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest httpx

      - name: Lint with flake8
        run: flake8 src/ --max-line-length=100 --extend-ignore=E203

      - name: Run tests
        run: pytest tests/ -v

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection-api:latest

      - name: Update Kubernetes manifest with new image tag
        run: |
          sed -i "s|image: .*fraud-detection-api:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection-api:${{ github.sha }}|" k8s/deployment.yaml
          cat k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "CI: update image to ${{ github.sha }}"
          git push